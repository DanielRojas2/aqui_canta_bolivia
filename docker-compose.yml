services:
  # =========================================================================
  # 1. Base de Datos MySQL 8.0 (Aislada en red interna + loopback 127.0.0.1:3307)
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: acb_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_acb_2026}
      MYSQL_DATABASE: ${DB_DATABASE:-festival_acb}
      MYSQL_USER: ${DB_USERNAME:-acb_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-acb_local_2026}
      TZ: America/La_Paz
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Enlazado a 127.0.0.1:3307 por defecto para no chocar con MySQL/MariaDB del host ni exponerse a IP pública
      - "${DB_BIND_IP:-127.0.0.1}:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    networks:
      acb_net:
        ipv4_address: 172.28.10.10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_acb_2026}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # =========================================================================
  # 2. Aplicación Web Laravel 12 (Nginx + PHP-FPM, puerto externo 9080)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aqui_canta_bolivia_app:latest
    container_name: acb_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: app
      TZ: America/La_Paz
      # Red interna Docker hacia MySQL y Reverb
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REVERB_HOST: reverb
      REVERB_PORT: 6080
      REVERB_SCHEME: http
      # Variables Vite compiladas al iniciar el contenedor
      VITE_APP_NAME: ${APP_NAME:-Aquí Canta Bolivia}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-rlml9nwlxkswhus5t6ca}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-6080}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    ports:
      # Puerto externo 9080 por defecto (configurable en .env con APP_BIND_IP / APP_EXTERNAL_PORT)
      - "${APP_BIND_IP:-0.0.0.0}:${APP_EXTERNAL_PORT:-9080}:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      acb_net:
        ipv4_address: 172.28.10.20
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/acb_app_ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # =========================================================================
  # 3. Servidor WebSocket Laravel Reverb (Tiempo Real, puerto externo 6080)
  # =========================================================================
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: aqui_canta_bolivia_app:latest
    container_name: acb_reverb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTAINER_ROLE: reverb
      TZ: America/La_Paz
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REVERB_HOST: reverb
      REVERB_PORT: 6080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6080
    ports:
      # Puerto externo 6080 por defecto (configurable en .env con REVERB_BIND_IP / REVERB_EXTERNAL_PORT)
      - "${REVERB_BIND_IP:-0.0.0.0}:${REVERB_EXTERNAL_PORT:-6080}:6080"
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    networks:
      acb_net:
        ipv4_address: 172.28.10.30

  # =========================================================================
  # 4. phpMyAdmin (Opcional bajo perfil "tools": docker compose --profile tools up -d)
  # =========================================================================
  phpmyadmin:
    image: docker.io/library/phpmyadmin:latest
    container_name: acb_phpmyadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_acb_2026}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_BIND_IP:-127.0.0.1}:${PMA_EXTERNAL_PORT:-9086}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      acb_net:
        ipv4_address: 172.28.10.40

networks:
  acb_net:
    name: acb_festival_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
